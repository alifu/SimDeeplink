name: Package desktop

# Builds the Tauri installers. Called by CI (to prove they build and install) and by the release workflow.
on:
  workflow_call:

jobs:
  windows:
    name: Windows (NSIS + msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis,msi
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/bundle/msi/*.msi out/
          (cd out && sha256sum * > SHA256SUMS-windows.txt && cat SHA256SUMS-windows.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux (deb + rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries and rpm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles deb,rpm
      - name: Collect packages
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/
          cp src-tauri/target/release/bundle/rpm/*.rpm out/
          (cd out && sha256sum * > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (universal app, ad-hoc signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles app
      - name: Check the app and pack the zip (same layout the Homebrew cask expects)
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/SimDeeplink.app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
          lipo -archs "$app/Contents/MacOS/"* | grep -q "x86_64 arm64"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist" | grep -qx "com.alifu.SimDeeplink"
          mkdir -p out/stage
          cp -R "$app" out/stage/
          cp LICENSE out/stage/
          cat > out/stage/README.txt <<'TXT'
          SimDeeplink is not notarized by Apple (that needs a paid developer account), so macOS blocks it the first time.
          Move SimDeeplink.app to /Applications, then allow it once:
            System Settings > Privacy & Security > "Open Anyway", or run
            xattr -dr com.apple.quarantine /Applications/SimDeeplink.app
          More: https://github.com/alifu/SimDeeplink#install
          TXT
          # A fixed name, so the link .../releases/latest/download/SimDeeplink.zip always works.
          ditto -c -k --keepParent out/stage out/SimDeeplink.zip
          rm -rf out/stage
          (cd out && shasum -a 256 SimDeeplink.zip > SimDeeplink.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: out/*
          if-no-files-found: error

  install-deb:
    name: Install ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
      - name: Install, check the libraries, remove
        run: |
          set -eux
          apt-get update
          name="$(dpkg-deb -f ./*.deb Package)"
          echo "package name: $name"
          apt-get install -y ./*.deb
          bin="$(dpkg -L "$name" | grep '/usr/bin/' | head -n 1)"
          test -x "$bin"
          if ldd "$bin" | grep "not found"; then exit 1; fi
          apt-get remove -y "$name"
          test ! -e "$bin"

  install-rpm:
    name: Install ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:40", "fedora:41"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
      - name: Install, check the libraries, remove
        run: |
          set -eux
          name="$(rpm -qp --qf '%{NAME}' ./*.rpm)"
          echo "package name: $name"
          dnf install -y ./*.rpm
          bin="$(rpm -ql "$name" | grep '/usr/bin/' | head -n 1)"
          test -x "$bin"
          if ldd "$bin" | grep "not found"; then exit 1; fi
          dnf remove -y "$name"
          test ! -e "$bin"
