name: Release

# Push a tag such as v0.1.1 (the same number as MARKETING_VERSION in the Xcode project).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tag and app name the same version
        run: sh Scripts/release/check-version.sh "${GITHUB_REF_NAME#v}"

      - name: Test the app
        run: |
          xcodebuild -project SimDeeplink.xcodeproj -scheme SimDeeplink \
            -destination 'platform=macOS' -only-testing:SimDeeplinkTests \
            CODE_SIGN_IDENTITY=- test

      - name: Build the app (universal, ad-hoc signed)
        run: |
          xcodebuild -project SimDeeplink.xcodeproj -scheme SimDeeplink -configuration Release \
            -derivedDataPath build CLANG_COVERAGE_MAPPING=NO ENABLE_CODE_COVERAGE=NO \
            CODE_SIGN_IDENTITY=- ONLY_ACTIVE_ARCH=NO build

      - name: Pack the prebuilt zip
        run: |
          mkdir -p dist/stage
          cp -R build/Build/Products/Release/SimDeeplink.app dist/stage/
          cp LICENSE dist/stage/
          cat > dist/stage/README.txt <<'TXT'
          SimDeeplink is not notarized by Apple (that needs a paid developer account), so macOS blocks it the first time.
          Move SimDeeplink.app to /Applications, then allow it once:
            System Settings > Privacy & Security > "Open Anyway", or run
            xattr -dr com.apple.quarantine /Applications/SimDeeplink.app
          More: https://github.com/alifu/SimDeeplink#install
          TXT
          # A fixed name, so the link .../releases/latest/download/SimDeeplink.zip always works.
          ditto -c -k --keepParent dist/stage dist/SimDeeplink.zip
          (cd dist && shasum -a 256 SimDeeplink.zip > SimDeeplink.zip.sha256)

      - name: Homebrew cask and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip_sha="$(cut -d ' ' -f 1 dist/SimDeeplink.zip.sha256)"
          sh Scripts/release/make-cask.sh "$version" "$zip_sha" > dist/simdeeplink.rb
          {
            echo "Install the prebuilt app (no Xcode needed to build it):"
            echo
            echo '```'
            echo "brew install --cask alifu/tap/simdeeplink"
            echo '```'
            echo
            echo "Or download \`SimDeeplink.zip\`, unzip it and drag \`SimDeeplink.app\` into \`/Applications\`."
            echo "SimDeeplink is not notarized: allow it once under System Settings > Privacy & Security > Open Anyway,"
            echo "or run \`xattr -dr com.apple.quarantine /Applications/SimDeeplink.app\`."
            echo
            echo "SHA-256 of \`SimDeeplink.zip\`: \`$zip_sha\`"
          } > dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/SimDeeplink.zip dist/SimDeeplink.zip.sha256 dist/simdeeplink.rb \
            --title "SimDeeplink ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md

      # Optional: with a TAP_TOKEN secret (a token that can push to alifu/homebrew-tap) the cask is updated by itself.
      # Without it, copy dist/simdeeplink.rb (attached to the release) to Casks/simdeeplink.rb in the tap.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/alifu/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp dist/simdeeplink.rb tap/Casks/simdeeplink.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/simdeeplink.rb
          git commit -m "simdeeplink ${GITHUB_REF_NAME#v}" || exit 0
          git push
