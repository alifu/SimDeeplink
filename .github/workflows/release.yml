name: Release

# Push a tag such as v0.1.0 (the same number as in tauri.conf.json, Cargo.toml and package.json).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Tag and app agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh Scripts/release/check-version.sh "${GITHUB_REF_NAME#v}"

  package:
    needs: version
    uses: ./.github/workflows/package-desktop.yml

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: assets

      - name: Homebrew cask and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip_sha="$(cut -d ' ' -f 1 assets/desktop-macos/SimDeeplink.zip.sha256)"
          sh Scripts/release/make-cask.sh "$version" "$zip_sha" > assets/simdeeplink.rb
          {
            echo "## macOS"
            echo
            echo '```'
            echo "brew install --cask alifu/tap/simdeeplink     # or: brew upgrade --cask simdeeplink"
            echo '```'
            echo
            echo "Or download \`SimDeeplink.zip\` and drag \`SimDeeplink.app\` into \`/Applications\`. It is not notarized:"
            echo "allow it once under System Settings > Privacy & Security > Open Anyway."
            echo
            echo "## Windows"
            echo
            echo "Run \`SimDeeplink_${version}_x64-setup.exe\` (or the \`.msi\`). It is not code-signed: SmartScreen > More info > Run anyway."
            echo
            echo "## Linux"
            echo
            echo "- Debian / Ubuntu: \`sudo apt install ./SimDeeplink_${version}_amd64.deb\`"
            echo "- Fedora: \`sudo dnf install ./SimDeeplink-${version}-1.x86_64.rpm\`"
            echo
            echo "Windows and Linux show the Android Emulator section only (the iOS Simulator exists only on macOS)."
            echo "Full instructions: https://github.com/alifu/SimDeeplink#-install"
            echo
            echo "SHA-256 of \`SimDeeplink.zip\`: \`$zip_sha\`"
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "SimDeeplink ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            assets/desktop-macos/* assets/simdeeplink.rb assets/desktop-windows/* assets/desktop-linux/*

      # Optional: with a TAP_TOKEN secret (a token that can push to alifu/homebrew-tap) the cask is updated by itself.
      # Without it, copy simdeeplink.rb (attached to the release) to Casks/simdeeplink.rb in the tap.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/alifu/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp assets/simdeeplink.rb tap/Casks/simdeeplink.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/simdeeplink.rb
          git commit -m "simdeeplink ${GITHUB_REF_NAME#v}" || exit 0
          git push
